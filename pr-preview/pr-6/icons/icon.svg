<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="glass" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" x2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset=".35" stop-color="#7a7a7a"/>
      <stop offset="1" stop-color="#2b2b2b"/>
    </linearGradient>
    <radialGradient id="puck" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset=".45" stop-color="#f5a524"/>
      <stop offset="1" stop-color="#b66a00"/>
    </radialGradient>
    <pattern id="stripes" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)">
      <rect width="40" height="14" fill="#f5a524" fill-opacity=".32"/>
      <rect y="14" width="40" height="14" fill="#ff5fa2" fill-opacity=".26"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#0f0f0f"/>
  <g transform="rotate(-24 256 256)">
    <rect x="196" y="112" width="120" height="288" fill="url(#stripes)"/>
    <rect x="196" y="112" width="120" height="288" fill="url(#glass)"/>
    <rect x="196" y="112" width="120" height="288" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="3"/>
    <ellipse cx="256" cy="300" rx="50" ry="30" fill="#f5a524" opacity=".6" filter="url(#glow)"/>
    <rect x="208" y="274" width="96" height="52" rx="22" fill="url(#puck)"/>
    <rect x="186" y="84" width="140" height="32" rx="9" fill="url(#cap)"/>
    <rect x="186" y="396" width="140" height="32" rx="9" fill="url(#cap)"/>
  </g>
</svg>
