<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0f0f0f" />
    <meta name="description" content="Tilt your phone and it groans." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Groan Tubes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Groan Tubes</title>
  </head>
  <body>
    <main id="app">
      <header class="readout" aria-live="off">
        <div><span class="label">Tilt</span><span id="r-tilt" class="value">—</span></div>
        <div><span class="label">Flow</span><span id="r-flow" class="value">0%</span></div>
        <div><span class="label">Pitch</span><span id="r-pitch" class="value">—</span></div>
      </header>

      <section id="stage">
        <div id="tube" aria-hidden="true">
          <div class="cap top"></div>
          <div id="tube-body">
            <div id="slider"></div>
          </div>
          <div class="cap bottom"></div>
        </div>
      </section>

      <footer>
        <div id="presets" role="radiogroup" aria-label="Sound"></div>
        <div id="diag" class="diag"></div>
        <div id="fallback" hidden>
          <span class="hint" id="fallback-hint"></span>
          <div class="buttons">
            <button id="enable-motion" type="button" hidden>Enable motion</button>
            <button id="flip" type="button">Flip</button>
          </div>
        </div>
      </footer>

      <div id="start" class="overlay">
        <h1>Groan Tubes</h1>
        <p>Turn your phone over. It groans.</p>
        <button id="start-btn" type="button">Tap to start</button>
        <p class="small" id="start-note"></p>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
